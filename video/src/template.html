const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={lin:x=>x,oc:x=>1-Math.pow(1-x,3),ox:x=>x>=1?1:1-Math.pow(2,-10*x),ic:x=>x*x*x,ioc:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 ob:(x,s=1.9)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2),oe:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};

 e.style.transform=tr;e.style.opacity=o.o??1;e.style.filter=o.b?`blur(${o.b}px)`:'';e.style.display=(o.o===0)?'none':'block'}

function drawBG(t){
 const hue=t<4?215:t<8?218:t<14?214:t<20?262:t<26?150:215;

 S(bgWord,{s:1.1+t*.04,r:-6+t*1.2,o:1,x:-380,y:60});

 if(t>=2.5&&t<3.75){e=slam(t,2.5,2.4);x=exitO(t,3.75,.25);const sk=P(t,3.0,.15,E.ox);
  S(w4,{...e,y:-40+x.y,o:e.o*x.o,b:x.b||e.b});S(strike,{x:0,y:-40,sx:sk,o:sk>0?x.o:0,r:-2});
